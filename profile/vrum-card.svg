<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img">
<title>Vrum - scanner OBD2 em Flutter</title>
<defs><linearGradient id="vg" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
<rect x=".5" y=".5" width="879" height="249" rx="8" fill="#111821" stroke="#1f2a37"/>
<path d="M8 22 V8 H22 M858 8 H872 V22 M8 228 V242 H22 M858 242 H872 V228" fill="none" stroke="#2a3948" stroke-width="1.5"/>
<text x="40" y="82" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="52" font-weight="800" letter-spacing="2" fill="url(#vg)">VRUM</text>
<text x="42" y="108" font-family="'JetBrains Mono','Cascadia Code',Consolas,'SF Mono',Menlo,monospace" font-size="12" letter-spacing="3" fill="#6b7280">SCANNER OBD2  ·  FLUTTER  ·  BLE</text>
<rect x="42" y="141" width="7" height="7" fill="#f59e0b" transform="rotate(45 45.5 144.5)"/>
<text x="62" y="150" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#e5e7eb">Leitura ao vivo: RPM, velocidade, temperatura e bateria</text>
<rect x="42" y="171" width="7" height="7" fill="#f59e0b" transform="rotate(45 45.5 174.5)"/>
<text x="62" y="180" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#e5e7eb">Códigos de falha explicados em linguagem simples</text>
<rect x="42" y="201" width="7" height="7" fill="#f59e0b" transform="rotate(45 45.5 204.5)"/>
<text x="62" y="210" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#e5e7eb">TireScan AI: análise de pneus 100% no aparelho</text>
<circle cx="524" cy="42" r="4" fill="#ef4444"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
<text x="536" y="46" font-family="'JetBrains Mono','Cascadia Code',Consolas,'SF Mono',Menlo,monospace" font-size="12" letter-spacing="3" fill="#6b7280">TELEMETRIA AO VIVO</text>
<text x="520" y="78" font-family="'JetBrains Mono','Cascadia Code',Consolas,'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="#6b7280">RPM</text>
<rect x="520" y="86" width="320" height="10" rx="5" fill="#1f2a37"/>
<rect x="520" y="86" width="100" height="10" rx="5" fill="#22d3ee"><animate attributeName="width" values="70;250;110;300;80;220;70" dur="4.8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.17;.33;.5;.67;.83;1" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/></rect>
<text x="520" y="114" font-family="'JetBrains Mono','Cascadia Code',Consolas,'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="#6b7280">TEMP</text>
<rect x="520" y="122" width="320" height="10" rx="5" fill="#1f2a37"/>
<rect x="520" y="122" width="100" height="10" rx="5" fill="#f59e0b"><animate attributeName="width" values="170;178;190;200;190;178;170" dur="9s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.17;.33;.5;.67;.83;1" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/></rect>
<text x="520" y="150" font-family="'JetBrains Mono','Cascadia Code',Consolas,'SF Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="#6b7280">BATERIA</text>
<rect x="520" y="158" width="320" height="10" rx="5" fill="#1f2a37"/>
<rect x="520" y="158" width="100" height="10" rx="5" fill="#34d399"><animate attributeName="width" values="262;258;266;260;264;258;262" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.17;.33;.5;.67;.83;1" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/></rect>
<rect x="520" y="196" width="320" height="34" rx="6" fill="#1a1405" stroke="#f59e0b" stroke-opacity=".6"/>
<circle cx="538" cy="213" r="5" fill="#f59e0b"><animate attributeName="opacity" values="1;.3;1" dur="1.4s" repeatCount="indefinite"/></circle>
<text x="554" y="217" font-family="'JetBrains Mono','Cascadia Code',Consolas,'SF Mono',Menlo,monospace" font-size="12" fill="#f59e0b">P0301  Falha de ignição no cilindro 1</text>
<text x="840" y="190" text-anchor="end" font-family="'JetBrains Mono','Cascadia Code',Consolas,'SF Mono',Menlo,monospace" font-size="10" letter-spacing="2" fill="#6b7280">EXEMPLO ILUSTRATIVO</text>
</svg>